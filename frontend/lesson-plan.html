<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson Plan | AlignED</title>
  <link rel="icon" href="img/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-transition" id="page-transition">
    <img src="img/owl/alan-idle.png" alt="" />
    <span>Loading&hellip;</span>
  </div>
  <div class="dash-shell">
    <header class="dash-topbar">
      <div class="brand-block">
        <img src="img/Icon.png" alt="" />
        <div>
          <div class="brand-name">AlignED</div>
          <div class="brand-sub">TLE-ICT Lesson Plan Maker</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" title="Notifications" aria-label="Notifications" id="bell-btn">
          <span class="dot"></span>
        </button>
        <div class="avatar-menu">
          <button class="avatar-btn" id="avatar-btn" type="button">
            <span class="avatar-chip js-user-initials">&nbsp;</span>
          </button>
          <div class="avatar-dropdown" id="avatar-dropdown">
            <div class="dd-user">
              <strong class="js-user-name">&nbsp;</strong>
              <span class="js-user-role">&nbsp;</span>
            </div>
            <button class="dd-item" type="button" onclick="window.location.href='settings.html'">Settings</button>
            <button class="dd-item danger" id="dd-logout-btn" type="button">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="dash-body">
      <aside class="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <span class="avatar-chip js-user-initials">&nbsp;</span>
          <div class="who">
            <strong class="js-user-name">&nbsp;</strong>
            <span class="js-user-role">&nbsp;</span>
          </div>
        </div>
      </aside>

      <main class="dash-main">
        <div class="page-header">
          <div class="page-heading">
            <h1 class="dash-page-title">Lesson Plan</h1>
            <p class="page-subtitle">Start from a ready-made school format, or use one of your own.</p>
          </div>
          <div class="page-actions">
            <button id="new-format-btn" class="btn btn-primary"><span data-icon="plus"></span>New format</button>
          </div>
        </div>

        <div id="error-box" class="alert alert-error" hidden></div>

        <!-- Unfinished plans, newest edit first. Hidden until there is at
             least one, so a first-time user still lands straight on the
             format picker. -->
        <section id="drafts-strip" class="drafts-strip" hidden aria-labelledby="drafts-strip-title">
          <div class="drafts-strip-head">
            <h2 id="drafts-strip-title" class="drafts-strip-title">Continue where you left off</h2>
            <a href="lesson-plan-list.html" class="text-sm">View all plans</a>
          </div>
          <div id="drafts-list" class="drafts-list"></div>
        </section>

        <div class="field" id="format-search-row" style="max-width:320px;" hidden>
          <label for="format-search">Search</label>
          <input type="text" id="format-search" placeholder="Search formats by name&hellip;" />
        </div>

        <div id="loading-state" class="card-grid">
          <div class="format-card format-card-skeleton skeleton"></div>
          <div class="format-card format-card-skeleton skeleton"></div>
          <div class="format-card format-card-skeleton skeleton"></div>
        </div>

        <div id="empty-state" class="empty-state" hidden>
          <h3>No formats yet</h3>
          <p>Add a lesson plan format, such as your school's DLP or SDLP, to start generating plans.</p>
          <button class="btn btn-primary" onclick="window.location.href='format-builder.html'"><span data-icon="plus"></span>New format</button>
        </div>

        <div id="format-grid" class="card-grid" hidden></div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/lesson-plan.js"></script>
</body>
</html>
