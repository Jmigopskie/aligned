<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password | AlignED</title>
  <link rel="icon" href="img/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=2026-10-26i" />
  <link rel="stylesheet" href="css/login-mobile.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-illustration">
      <img src="img/Icon.png" alt="AlignED logo" />
      <div class="wordmark">Align<span>ED</span></div>
      <p class="tagline">TLE-ICT lesson plans, aligned to your course guide and ready in minutes.</p>
    </div>

    <div class="auth-panel">
      <h1 id="title">Forgot your password?</h1>
      <p class="auth-subtitle" id="subtitle">Enter your email and we'll send you a 6-digit code.</p>

      <div id="form-error" class="alert alert-error" hidden></div>
      <div id="form-info" class="alert alert-info" hidden></div>

      <!-- Step 1: ask for a code -->
      <form id="email-form" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="juan@gsfe.tupcavite.edu.ph" required />
        </div>
        <button type="submit" id="send-btn" class="btn btn-primary btn-block">Send code</button>
      </form>

      <!-- Step 2: the code and a new password -->
      <form id="reset-form" novalidate hidden>
        <div class="field">
          <label for="code">6-digit code</label>
          <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" required />
        </div>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8" />
        </div>
        <div class="field">
          <label for="confirm_password">Confirm new password</label>
          <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" placeholder="Re-enter your new password" required minlength="8" />
        </div>
        <button type="submit" id="reset-btn" class="btn btn-primary btn-block">Reset password</button>
        <p class="text-sm text-center" style="margin-top:14px;">
          No email? Check your spam folder, or <a href="#" id="resend-link"><strong>send a new code</strong></a>.
        </p>
      </form>

      <div class="auth-divider">OR</div>

      <p class="text-sm text-center mt-0">
        Remembered it? <a href="index.html"><strong>Log in here</strong></a>
      </p>
    </div>
  </div>

  <script src="js/api.js?v=2026-10-26i"></script>
  <script>
    const emailForm = document.getElementById("email-form");
    const resetForm = document.getElementById("reset-form");
    const errorBox = document.getElementById("form-error");
    const infoBox = document.getElementById("form-info");
    const sendBtn = document.getElementById("send-btn");
    const resetBtn = document.getElementById("reset-btn");
    const emailInput = document.getElementById("email");

    function show(box, text) {
      errorBox.hidden = true;
      infoBox.hidden = true;
      if (box) {
        box.textContent = text;
        box.hidden = false;
      }
    }

    async function sendCode() {
      const email = emailInput.value.trim();
      if (!email) {
        show(errorBox, "Enter your email address.");
        return;
      }
      setButtonLoading(sendBtn, true, "Sending");
      try {
        const data = await Api.forgotPassword(email);
        emailForm.hidden = true;
        resetForm.hidden = false;
        document.getElementById("title").textContent = "Check your email";
        document.getElementById("subtitle").textContent = `Enter the code sent to ${email} and choose a new password.`;
        show(infoBox, data.message);
        document.getElementById("code").focus();
      } catch (err) {
        show(errorBox, err.message);
      } finally {
        setButtonLoading(sendBtn, false);
      }
    }

    emailForm.addEventListener("submit", (e) => {
      e.preventDefault();
      sendCode();
    });

    document.getElementById("resend-link").addEventListener("click", (e) => {
      e.preventDefault();
      resetForm.hidden = true;
      emailForm.hidden = false;
      sendCode();
    });

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = document.getElementById("code").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm_password").value;
      if (!/^\d{6}$/.test(code)) {
        show(errorBox, "The code is the 6 digits in the email.");
        return;
      }
      if (password !== confirm) {
        show(errorBox, "Passwords don't match.");
        return;
      }
      setButtonLoading(resetBtn, true, "Resetting");
      try {
        await Api.resetPassword({ email: emailInput.value.trim(), code, password });
        showToast("Password changed. Log in with your new password.");
        setTimeout(() => { window.location.href = "index.html"; }, 1200);
      } catch (err) {
        show(errorBox, err.message);
        setButtonLoading(resetBtn, false);
      }
    });
  </script>
</body>
</html>
