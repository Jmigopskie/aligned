<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>List of Lesson Plans | AlignED</title>
  <link rel="icon" href="img/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=2026-10-06b" />
</head>
<body>
  <div class="page-transition" id="page-transition">
    <img src="img/owl/alan-loading.png" alt="" />
    <span>Loading&hellip;</span>
  </div>
  <div class="dash-shell">
    <header class="dash-topbar">
      <div class="brand-block">
        <img src="img/Icon.png" alt="" />
        <div>
          <div class="brand-name">AlignED</div>
          <div class="brand-sub">Lesson Plan Maker</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" title="Notifications" aria-label="Notifications" id="bell-btn">
          <span class="dot"></span>
        </button>
        <div class="avatar-menu">
          <button class="avatar-btn" id="avatar-btn" type="button">
            <span class="avatar-chip js-user-initials">&nbsp;</span>
          </button>
          <div class="avatar-dropdown" id="avatar-dropdown">
            <div class="dd-user">
              <strong class="js-user-name">&nbsp;</strong>
              <span class="js-user-role">&nbsp;</span>
            </div>
            <button class="dd-item" type="button" onclick="window.location.href='settings.html'">Settings</button>
            <button class="dd-item danger" id="dd-logout-btn" type="button">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="dash-body">
      <aside class="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <span class="avatar-chip js-user-initials">&nbsp;</span>
          <div class="who">
            <strong class="js-user-name">&nbsp;</strong>
            <span class="js-user-role">&nbsp;</span>
          </div>
        </div>
      </aside>

      <main class="dash-main">
        <div class="page-header">
          <div class="page-heading">
            <h1 class="dash-page-title">List of Lesson Plans</h1>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="window.location.href='lesson-plan.html'"><span data-icon="plus"></span>Create New Lesson Plan</button>
          </div>
        </div>

        <div class="mode-switch" id="plans-tab-switch" style="margin-bottom:18px;">
          <button type="button" class="active" data-tab="mine">My Lesson Plans</button>
          <button type="button" data-tab="public">Public Lesson Plans</button>
        </div>

        <div class="filter-bar">
          <div class="field field-wide">
            <label for="search-input">Search</label>
            <input type="text" id="search-input" placeholder="Search by title or course&hellip;" />
          </div>
          <div class="field" id="status-filter-field">
            <label for="status-filter">Status</label>
            <select id="status-filter">
              <option value="">All plans</option>
              <option value="draft">Drafts</option>
              <option value="submitted">Pending review</option>
              <option value="reviewed">Reviewed</option>
            </select>
          </div>
          <div class="field">
            <label for="sort-select">Sort by</label>
            <select id="sort-select">
              <option value="date">Date (newest first)</option>
              <option value="name">Name (A&ndash;Z)</option>
              <option value="score">Score (highest first)</option>
            </select>
          </div>
        </div>

        <div id="error-box" class="alert alert-error" hidden></div>

        <div class="section-card">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Lesson</th>
                  <th>Grade</th>
                  <th class="js-author-col" hidden>Author</th>
                  <th class="js-status-col" hidden>Status</th>
                  <th class="js-score-col" hidden>Score</th>
                  <th>Updated</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="plans-body">
                <tr class="table-empty-row"><td colspan="6">Loading&hellip;</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="preview-overlay" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title">
      <div class="modal-header">
        <h2 id="preview-title">Lesson plan preview</h2>
        <button type="button" class="modal-close" id="preview-close" aria-label="Close preview">&times;</button>
      </div>
      <div class="modal-body" id="preview-body"></div>
    </div>
  </div>

  <div class="modal-overlay" id="submit-overlay" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="submit-title" style="max-width:440px;">
      <div class="modal-header">
        <h2 id="submit-title">Submit to a class</h2>
        <button type="button" class="modal-close" id="submit-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="submit-form">
          <div class="field">
            <label for="submit-section-select">Class</label>
            <select id="submit-section-select"></select>
          </div>
          <button type="button" id="submit-preview-link" class="btn btn-ghost btn-sm" style="margin-bottom:14px; padding-left:0;">Preview before submitting</button>
          <button type="submit" class="btn btn-primary btn-block" id="submit-confirm-btn">Submit lesson plan</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=2026-10-06b"></script>
  <script src="js/icons.js?v=2026-10-06b"></script>
  <script src="js/lesson-plan-list.js?v=2026-10-06b"></script>
</body>
</html>
