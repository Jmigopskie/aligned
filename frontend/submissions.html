<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submissions — AlignED</title>
  <link rel="icon" href="img/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-transition" id="page-transition">
    <img src="img/owl/alan-idle.png" alt="" />
    <span>Loading&hellip;</span>
  </div>
  <div class="dash-shell">
    <header class="dash-topbar">
      <div class="brand-block">
        <img src="img/Icon.png" alt="" />
        <div>
          <div class="brand-name">AlignED</div>
          <div class="brand-sub">TLE-ICT Lesson Plan Maker</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" title="Notifications" aria-label="Notifications" id="bell-btn">
          <span class="dot"></span>
        </button>
        <div class="avatar-menu">
          <button class="avatar-btn" id="avatar-btn" type="button">
            <span class="avatar-chip js-user-initials">&nbsp;</span>
          </button>
          <div class="avatar-dropdown" id="avatar-dropdown">
            <div class="dd-user">
              <strong class="js-user-name">&nbsp;</strong>
              <span class="js-user-role">&nbsp;</span>
            </div>
            <button class="dd-item" type="button" onclick="window.location.href='settings.html'">Settings</button>
            <button class="dd-item danger" id="dd-logout-btn" type="button">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="dash-body">
      <aside class="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <span class="avatar-chip js-user-initials">&nbsp;</span>
          <div class="who">
            <strong class="js-user-name">&nbsp;</strong>
            <span class="js-user-role">&nbsp;</span>
          </div>
        </div>
      </aside>

      <main class="dash-main">
        <div class="page-header">
          <h1 class="dash-page-title" style="margin-bottom:0;">Submissions</h1>
        </div>
        <p class="text-sm mt-0" style="margin-bottom:18px;">Lesson plans your students have submitted for review.</p>

        <div id="error-box" class="alert alert-error" hidden></div>

        <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:20px;">
          <div class="field" style="max-width:280px; margin-bottom:0;">
            <label for="section-select">Section</label>
            <select id="section-select"></select>
          </div>
          <div class="field" style="max-width:200px; margin-bottom:0;">
            <label for="status-select">Status</label>
            <select id="status-select">
              <option value="">All</option>
              <option value="submitted">Pending review</option>
              <option value="reviewed">Reviewed</option>
            </select>
          </div>
          <div class="field" style="max-width:200px; margin-bottom:0;">
            <label for="sort-select">Sort by</label>
            <select id="sort-select">
              <option value="date">Date (newest first)</option>
              <option value="name">Name (A&ndash;Z)</option>
              <option value="score">Score (highest first)</option>
            </select>
          </div>
        </div>

        <div id="no-sections-state" class="empty-state" hidden>
          <h3>No sections yet</h3>
          <p>Create a section first so students can join and submit lesson plans.</p>
          <button class="btn btn-primary" onclick="window.location.href='sections.html'">Go to My Sections</button>
        </div>

        <div id="submissions-list"></div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="review-overlay" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="review-title">
      <div class="modal-header">
        <h2 id="review-title">Lesson plan</h2>
        <button type="button" class="modal-close" id="review-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="review-body"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/submissions.js"></script>
</body>
</html>
