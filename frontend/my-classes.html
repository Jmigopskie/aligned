<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Classes | AlignED</title>
  <link rel="icon" href="img/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=2026-10-26g" />
</head>
<body>
  <div class="page-transition" id="page-transition">
    <img src="img/owl/alan-loading.png" alt="" />
    <span>Loading&hellip;</span>
  </div>
  <div class="dash-shell">
    <header class="dash-topbar">
      <div class="brand-block">
        <img src="img/Icon.png" alt="" />
        <div>
          <div class="brand-name">AlignED</div>
          <div class="brand-sub">Lesson Plan Maker</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" title="Notifications" aria-label="Notifications" id="bell-btn">
          <span class="dot"></span>
        </button>
        <div class="avatar-menu">
          <button class="avatar-btn" id="avatar-btn" type="button">
            <span class="avatar-chip js-user-initials">&nbsp;</span>
          </button>
          <div class="avatar-dropdown" id="avatar-dropdown">
            <div class="dd-user">
              <strong class="js-user-name">&nbsp;</strong>
              <span class="js-user-role">&nbsp;</span>
            </div>
            <button class="dd-item" type="button" onclick="window.location.href='settings.html'">Settings</button>
            <button class="dd-item danger" id="dd-logout-btn" type="button">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="dash-body">
      <aside class="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <span class="avatar-chip js-user-initials">&nbsp;</span>
          <div class="who">
            <strong class="js-user-name">&nbsp;</strong>
            <span class="js-user-role">&nbsp;</span>
          </div>
        </div>
      </aside>

      <main class="dash-main">
        <div class="page-header">
          <div class="page-heading">
            <h1 class="dash-page-title">My Classes</h1>
            <p class="page-subtitle">Join a class with the code your teacher gives you, then submit your lesson plans straight to them.</p>
          </div>
        </div>

        <div id="error-box" class="alert alert-error" hidden></div>

        <section class="panel join-panel" aria-labelledby="join-title">
          <h2 class="panel-title" id="join-title">Join a class</h2>
          <form id="join-form" class="filter-bar join-form">
            <div class="field field-wide">
              <label for="join-code">Class code</label>
              <input type="text" id="join-code" placeholder="e.g. 7K2QXB" maxlength="10" autocapitalize="characters" autocomplete="off" required />
            </div>
            <button type="submit" class="btn btn-primary" id="join-submit-btn">Join</button>
          </form>
        </section>

        <h2 class="section-title section-title-spaced">Classes you've joined</h2>
        <div id="loading-state" class="class-card-grid">
          <div class="class-card skeleton" style="height:120px;"></div>
        </div>
        <div id="empty-state" class="empty-state" hidden>
          <h2>No classes yet</h2>
          <p>Ask your teacher for their class code and join it above.</p>
        </div>
        <div id="class-grid" class="class-card-grid" hidden></div>
      </main>
    </div>
  </div>

  <script src="js/api.js?v=2026-10-26f"></script>
  <script src="js/icons.js?v=2026-10-26f"></script>
  <script src="js/my-classes.js"></script>
</body>
</html>
