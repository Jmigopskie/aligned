<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Activity | AlignED</title>
  <link rel="icon" href="img/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=2026-11-23a" />
</head>
<body>
  <div class="page-transition" id="page-transition">
    <img src="img/owl/alan-loading.png" alt="" />
    <span>Loading&hellip;</span>
  </div>
  <div class="dash-shell">
    <header class="dash-topbar">
      <div class="brand-block">
        <img src="img/Icon.png" alt="" />
        <div>
          <div class="brand-name">AlignED</div>
          <div class="brand-sub">Admin Console</div>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="avatar-menu">
          <button class="avatar-btn" id="avatar-btn" type="button">
            <span class="avatar-chip js-user-initials">&nbsp;</span>
          </button>
          <div class="avatar-dropdown" id="avatar-dropdown">
            <div class="dd-user">
              <strong class="js-user-name">&nbsp;</strong>
              <span class="js-user-role">&nbsp;</span>
            </div>
            <button class="dd-item" type="button" onclick="window.location.href='settings.html'">Settings</button>
            <button class="dd-item danger" id="dd-logout-btn" type="button">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="dash-body">
      <aside class="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <span class="avatar-chip js-user-initials">&nbsp;</span>
          <div class="who">
            <strong class="js-user-name">&nbsp;</strong>
            <span class="js-user-role">&nbsp;</span>
          </div>
        </div>
      </aside>

      <main class="dash-main">
        <div class="page-header">
          <div class="page-heading">
            <h1 class="dash-page-title">User Activity</h1>
            <p class="page-subtitle">What each account did and when: sign-ins (and failed ones), lesson plans saved, written by Alan, downloaded, submitted and reviewed, and account changes. Newest first. Only admins see this page.</p>
          </div>
        </div>

        <div id="error-box" class="alert alert-error" hidden></div>

        <div class="filter-bar">
          <div class="field" style="flex:1; min-width:220px; margin-bottom:0;">
            <label for="search-input">Search</label>
            <input type="search" id="search-input" name="q" autocomplete="off" spellcheck="false" maxlength="100"
                   placeholder="Search by name, email, action or lesson plan…" />
          </div>
        </div>

        <div class="section-card">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Who</th>
                  <th>Action</th>
                  <th>Details</th>
                  <th>IP address</th>
                </tr>
              </thead>
              <tbody id="activity-body">
                <tr class="table-empty-row"><td colspan="5">Loading&hellip;</td></tr>
              </tbody>
            </table>
          </div>
          <div class="activity-pager">
            <span class="text-sm" id="pager-info"></span>
            <button type="button" class="btn btn-secondary btn-sm" id="prev-btn" disabled>Newer</button>
            <button type="button" class="btn btn-secondary btn-sm" id="next-btn" disabled>Older</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js?v=2026-11-23a"></script>
  <script src="js/icons.js?v=2026-11-23a"></script>
  <script src="js/admin-activity.js?v=2026-11-23a"></script>
</body>
</html>
