<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | AlignED</title>
  <link rel="icon" href="img/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=2026-10-26r" />
</head>
<body>
  <div class="page-transition" id="page-transition">
    <img src="img/owl/alan-loading.png" alt="" />
    <span>Loading&hellip;</span>
  </div>
  <div class="dash-shell">
    <header class="dash-topbar">
      <div class="brand-block">
        <img src="img/Icon.png" alt="" />
        <div>
          <div class="brand-name">AlignED</div>
          <div class="brand-sub">Lesson Plan Maker</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" title="Notifications" aria-label="Notifications" id="bell-btn">
          <span class="dot"></span>
        </button>
        <div class="avatar-menu">
          <button class="avatar-btn" id="avatar-btn" type="button">
            <span class="avatar-chip js-user-initials">&nbsp;</span>
          </button>
          <div class="avatar-dropdown" id="avatar-dropdown">
            <div class="dd-user">
              <strong class="js-user-name">&nbsp;</strong>
              <span class="js-user-role">&nbsp;</span>
            </div>
            <button class="dd-item" type="button" onclick="window.location.href='settings.html'">Settings</button>
            <button class="dd-item danger" id="dd-logout-btn" type="button">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="dash-body">
      <aside class="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <span class="avatar-chip js-user-initials">&nbsp;</span>
          <div class="who">
            <strong class="js-user-name">&nbsp;</strong>
            <span class="js-user-role">&nbsp;</span>
          </div>
        </div>
      </aside>

      <main class="dash-main">
        <div id="error-box" class="alert alert-error" hidden></div>

        <section class="hero-banner">
          <div class="hero-image-bg">
            <img id="hero-banner-img" src="img/mascot.png" alt="Illustration of a teacher in a classroom" />
          </div>
          <div class="hero-text">
            <h1 id="hero-greeting">Good morning</h1>
            <a class="points-chip js-role-action" data-role="student" id="hero-points" href="my-classes.html" hidden></a>
            <div class="hero-actions">
              <button class="btn btn-primary" onclick="window.location.href='generator.html'" data-icon="filePlus">Create New Lesson Plan</button>
              <button class="btn btn-secondary" onclick="window.location.href='lesson-plan-list.html'" data-icon="list">Browse My Lesson Plans</button>
              <button class="btn btn-secondary js-role-action" data-role="teacher" onclick="window.location.href='sections.html'" data-icon="plusCircle" hidden>Create Section</button>
              <button class="btn btn-secondary js-role-action" data-role="teacher" onclick="window.location.href='settings.html'" data-icon="image" hidden>Change Banner</button>
              <button class="btn btn-secondary js-role-action" data-role="student" onclick="window.location.href='my-classes.html'" data-icon="users" hidden>Join a Class</button>
            </div>
          </div>
        </section>

        <div class="section-card">
          <div class="section-card-header">
            <h2>Recent lesson plans</h2>
            <a class="section-link" href="lesson-plan-list.html">View all &rsaquo;</a>
          </div>
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Course</th>
                  <th>Grade</th>
                  <th>Updated</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="recent-plans-body">
                <tr class="table-empty-row"><td colspan="5">Loading&hellip;</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js?v=2026-10-30a"></script>
  <script src="js/icons.js?v=2026-10-26q"></script>
  <script src="js/dashboard.js?v=2026-10-26p"></script>
</body>
</html>
