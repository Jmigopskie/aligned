<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | AlignED</title>
  <link rel="icon" href="img/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=2026-10-26r" />
</head>
<body>
  <div class="page-transition" id="page-transition">
    <img src="img/owl/alan-loading.png" alt="" />
    <span>Loading&hellip;</span>
  </div>
  <div class="dash-shell">
    <header class="dash-topbar">
      <div class="brand-block">
        <img src="img/Icon.png" alt="" />
        <div>
          <div class="brand-name">AlignED</div>
          <div class="brand-sub">Admin Console</div>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="avatar-menu">
          <button class="avatar-btn" id="avatar-btn" type="button">
            <span class="avatar-chip js-user-initials">&nbsp;</span>
          </button>
          <div class="avatar-dropdown" id="avatar-dropdown">
            <div class="dd-user">
              <strong class="js-user-name">&nbsp;</strong>
              <span class="js-user-role">&nbsp;</span>
            </div>
            <button class="dd-item" type="button" onclick="window.location.href='settings.html'">Settings</button>
            <button class="dd-item danger" id="dd-logout-btn" type="button">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="dash-body">
      <aside class="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <span class="avatar-chip js-user-initials">&nbsp;</span>
          <div class="who">
            <strong class="js-user-name">&nbsp;</strong>
            <span class="js-user-role">&nbsp;</span>
          </div>
        </div>
      </aside>

      <main class="dash-main">
        <div class="page-header">
          <div class="page-heading">
            <h1 class="dash-page-title">Admin dashboard</h1>
            <p class="page-subtitle">A platform-wide view of accounts, classes, and lesson plans.</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-secondary" onclick="window.location.href='admin-documents.html'">View documents</button>
            <button class="btn btn-secondary" onclick="window.location.href='admin-announcements.html'">Announcements</button>
            <button class="btn btn-primary" onclick="window.location.href='admin-users.html'">Manage users</button>
          </div>
        </div>

        <div id="error-box" class="alert alert-error" hidden></div>

        <div class="stat-ledger">
          <div class="stat-ledger-item">
            <div class="stat-ledger-value" id="stat-teachers">&ndash;</div>
            <div class="stat-ledger-label">Teachers</div>
          </div>
          <div class="stat-ledger-item">
            <div class="stat-ledger-value" id="stat-students">&ndash;</div>
            <div class="stat-ledger-label">Students</div>
          </div>
          <div class="stat-ledger-item">
            <div class="stat-ledger-value" id="stat-sections">&ndash;</div>
            <div class="stat-ledger-label">Sections</div>
          </div>
          <div class="stat-ledger-item">
            <div class="stat-ledger-value" id="stat-plans">&ndash;</div>
            <div class="stat-ledger-label">Lesson plans</div>
          </div>
          <div class="stat-ledger-item">
            <div class="stat-ledger-value" id="stat-guides">&ndash;</div>
            <div class="stat-ledger-label">Course guides</div>
          </div>
          <div class="stat-ledger-item">
            <div class="stat-ledger-value" id="stat-submitted">&ndash;</div>
            <div class="stat-ledger-label">Pending review</div>
          </div>
        </div>

        <div class="two-col-grid mt-24">
          <div class="section-card">
            <div class="section-card-header"><h2>All sections</h2></div>
            <div id="sections-list"><p class="text-sm">Loading&hellip;</p></div>
          </div>
          <div class="section-card">
            <div class="section-card-header"><h2>Recent lesson plans</h2></div>
            <div id="plans-list"><p class="text-sm">Loading&hellip;</p></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js?v=2026-10-30a"></script>
  <script src="js/icons.js?v=2026-10-26q"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
