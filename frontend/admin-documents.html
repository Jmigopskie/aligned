<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documents | AlignED</title>
  <link rel="icon" href="img/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=2026-10-26r" />
</head>
<body>
  <div class="page-transition" id="page-transition">
    <img src="img/owl/alan-loading.png" alt="" />
    <span>Loading&hellip;</span>
  </div>
  <div class="dash-shell">
    <header class="dash-topbar">
      <div class="brand-block">
        <img src="img/Icon.png" alt="" />
        <div>
          <div class="brand-name">AlignED</div>
          <div class="brand-sub">Admin Console</div>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="avatar-menu">
          <button class="avatar-btn" id="avatar-btn" type="button">
            <span class="avatar-chip js-user-initials">&nbsp;</span>
          </button>
          <div class="avatar-dropdown" id="avatar-dropdown">
            <div class="dd-user">
              <strong class="js-user-name">&nbsp;</strong>
              <span class="js-user-role">&nbsp;</span>
            </div>
            <button class="dd-item" type="button" onclick="window.location.href='settings.html'">Settings</button>
            <button class="dd-item danger" id="dd-logout-btn" type="button">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="dash-body">
      <aside class="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <span class="avatar-chip js-user-initials">&nbsp;</span>
          <div class="who">
            <strong class="js-user-name">&nbsp;</strong>
            <span class="js-user-role">&nbsp;</span>
          </div>
        </div>
      </aside>

      <main class="dash-main">
        <div class="page-header">
          <div class="page-heading">
            <h1 class="dash-page-title">Documents</h1>
            <p class="page-subtitle">Every lesson plan, course guide, and section created across the platform.</p>
          </div>
        </div>

        <div id="error-box" class="alert alert-error" hidden></div>

        <div class="gen-tabs" id="doc-tabs">
          <button type="button" class="active" data-tab="lesson-plans">Lesson Plans</button>
          <button type="button" data-tab="course-guides">Course Guides</button>
          <button type="button" data-tab="sections">Sections</button>
        </div>

        <div id="tab-panel-lesson-plans" class="tab-panel">
          <div class="filter-bar">
            <div class="field">
              <label for="plan-status-filter">Status</label>
              <select id="plan-status-filter">
                <option value="">All statuses</option>
                <option value="draft">Draft</option>
                <option value="submitted">Pending review</option>
                <option value="reviewed">Reviewed</option>
              </select>
            </div>
            <div class="field">
              <label for="plan-sort-select">Sort by</label>
              <select id="plan-sort-select">
                <option value="date">Date (newest first)</option>
                <option value="name">Name (A&ndash;Z)</option>
                <option value="score">Score (highest first)</option>
              </select>
            </div>
          </div>
          <div class="section-card">
            <div class="table-scroll">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Section</th>
                    <th>Status</th>
                    <th>Score</th>
                    <th>Updated</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="plans-body">
                  <tr class="table-empty-row"><td colspan="7">Loading&hellip;</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="tab-panel-course-guides" class="tab-panel" hidden>
          <div class="filter-bar">
            <div class="field" style="flex:1; min-width:220px; margin-bottom:0;">
              <label for="guide-subject-filter">Subject</label>
              <input type="text" id="guide-subject-filter" placeholder="Filter by subject" />
            </div>
          </div>
          <div class="section-card">
            <div class="table-scroll">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Subject</th>
                    <th>Uploaded by</th>
                    <th>Uploaded</th>
                  </tr>
                </thead>
                <tbody id="guides-body">
                  <tr class="table-empty-row"><td colspan="4">Loading&hellip;</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="tab-panel-sections" class="tab-panel" hidden>
          <div class="section-card">
            <div class="table-scroll">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Teacher</th>
                    <th>Subject</th>
                    <th>Students</th>
                    <th>Join code</th>
                    <th>Created</th>
                  </tr>
                </thead>
                <tbody id="sections-body">
                  <tr class="table-empty-row"><td colspan="6">Loading&hellip;</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js?v=2026-10-26q"></script>
  <script src="js/icons.js?v=2026-10-26q"></script>
  <script src="js/admin-documents.js"></script>
</body>
</html>
